name: MLWorkflow

on:
  workflow_dispatch

jobs:
  job1:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./modelCleaning
    steps:
      - name: setup python3.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: setup code repo
        uses: actions/checkout@v6
      - name: CleanData
        run: |
            pip3 install pandas joblib scikit-learn
            python cleanData.py
            ls -l
      - name: TrainModel
        run: |
            python train_test.py
            ls -l

          

